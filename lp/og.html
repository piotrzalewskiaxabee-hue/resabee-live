<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>OG - Mapa wyszukiwań Black Week</title>
<script src="https://cdn.jsdelivr.net/npm/d3-array@3"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#231F20;color:#fff;font-family:Poppins,Arial,sans-serif;position:relative}
#map{position:absolute;left:330px;top:-40px;width:1000px;height:680px}
#map path{fill:#322D2E;stroke:#4A4345;stroke-width:.7}
#map path.pl{fill:#4A4345;stroke:#A7A9AC}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#231F20 0,#231F20 34%,rgba(35,31,32,.65) 48%,rgba(35,31,32,0) 66%)}
.txt{position:absolute;left:70px;top:64px;bottom:60px;width:640px;display:flex;flex-direction:column}
.txt img{height:52px;width:auto;align-self:flex-start}
.pills{display:flex;gap:12px;margin-top:56px}
.pill{font-size:15px;font-weight:700;letter-spacing:.1em;border-radius:99px;padding:7px 16px}
.red{background:#F31C2A}
.live{border:1px solid #58595B;display:inline-flex;align-items:center;gap:8px;font-weight:600}
.live i{width:10px;height:10px;border-radius:50%;background:#22C55E}
h1{font-size:66px;line-height:1.04;font-weight:700;letter-spacing:-.02em;margin-top:22px}
h1 span{color:#F31C2A;display:block}
p{font-size:24px;line-height:1.4;font-weight:300;color:#DCDDDE;margin-top:18px}
.url{margin-top:auto;font-size:20px;font-weight:600;color:#A7A9AC}
</style>
</head>
<body>
<svg id="map" viewBox="0 0 1000 680"></svg>
<div class="fade"></div>
<div class="txt">
  <img src="https://cdn.prod.website-files.com/66c6eb8e832658d31d056d07/67505a7277156b478a419355_resabee-travel-tech.webp" alt="Resabee Travel Tech">
  <div class="pills"><span class="pill red">BLACK WEEK 2026</span><span class="pill live"><i></i>LIVE</span></div>
  <h1>Mapa wyszukiwań <span>Black Week</span></h1>
  <p>Zobacz na żywo, czego szukają klienci biur podróży.</p>
  <div class="url">resabee.com</div>
</div>
<script>
const D=[[627.2,379.1,1],[635.9,398.7,1],[631.4,373.2,0],[602.2,287.3,1],[221.3,369.7,0],[376.5,260,0],[554.7,303.9,0],[582.3,292.1,0],[515.5,259.5,0],[442.5,317.9,0],[625.8,307,0],[277.9,350.1,0],[219.1,329,0],[799.9,397.6,0],[670.6,656.9,0]];
const A=[[523.9,113.4],[508.7,135.3],[514.3,140.2],[491.1,127.3],[490.6,110.1],[503.8,83.7],[532.4,139.8],[537.9,125.5],[475.1,94.6],[499.8,101.1],[511.3,119.3],[521.3,109.7]];
(async()=>{
  const topo=await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')).json();
  const path=d3.geoPath(d3.geoMercator().scale(461.1146).translate([355.1366,607.2686]));
  let s=topojson.feature(topo,topo.objects.countries).features.map(f=>{const d=path(f);return d?'<path d="'+d+'"'+(f.properties.name==='Poland'?' class="pl"':'')+'/>':''}).join('');
  const W=[[508.7,135.3,627.2,379.1],[523.9,113.4,602.2,287.3],[491.1,127.3,221.3,369.7],[514.3,140.2,635.9,398.7],[503.8,83.7,799.9,397.6]];
  for(const [x1,y1,x2,y2] of W){const mx=(x1+x2)/2,my=(y1+y2)/2-Math.hypot(x2-x1,y2-y1)*.22;s+=`<path d="M${x1},${y1} Q${mx},${my} ${x2},${y2}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/>`}
  for(const [x,y,h] of D){s+=h?`<circle cx="${x}" cy="${y}" r="16" fill="none" stroke="rgba(243,28,42,.55)" stroke-width="2"/><circle cx="${x}" cy="${y}" r="6" fill="#F31C2A"/>`:`<circle cx="${x}" cy="${y}" r="9" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="3" fill="#fff"/>`}
  for(const [x,y] of A)s+=`<circle cx="${x}" cy="${y}" r="3" fill="#fff"/>`;
  document.getElementById('map').innerHTML=s;
  document.body.dataset.ready='1';
})();
</script>
</body>
</html>
